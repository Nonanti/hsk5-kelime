<style>
:root{--bg:#0f1115;--card:#1a1d26;--fg:#e8e9ed;--muted:#8b8fa3;--accent:#4f8cff;--good:#3ecf8e;--bad:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;padding:12px;max-width:720px;margin:0 auto}
h1{font-size:1.25rem;margin:8px 0 4px}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:12px;line-height:1.5}
.exam{background:#2a1f1f;border:1px solid var(--bad);border-radius:10px;padding:10px 14px;font-size:.9rem;margin-bottom:12px;line-height:1.6}
.bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
button{background:var(--card);color:var(--fg);border:1px solid #2a2e3d;border-radius:10px;padding:10px 12px;font-size:.9rem;cursor:pointer;flex:1;min-width:88px}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
input{background:var(--card);border:1px solid #2a2e3d;border-radius:10px;color:var(--fg);padding:10px 14px;font-size:1rem;width:100%;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.w{background:var(--card);border-radius:10px;padding:10px 12px;border:1px solid #2a2e3d}
.w .h{font-size:1.5rem;line-height:1.2}
.w .p{color:var(--accent);font-size:.85rem;margin-top:2px}
.w .t{color:var(--muted);font-size:.8rem;margin-top:2px}
.w.known{opacity:.35}
.sec{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px}
.card{background:var(--card);border-radius:16px;padding:36px 20px;text-align:center;border:1px solid #2a2e3d;cursor:pointer;user-select:none;min-height:220px;display:flex;flex-direction:column;justify-content:center}
.card .h{font-size:3.4rem}
.card .p{color:var(--accent);font-size:1.3rem;margin-top:10px}
.card .t{color:var(--fg);font-size:1.1rem;margin-top:6px}
.card .hint{color:var(--muted);font-size:.8rem;margin-top:24px}
.row{display:flex;gap:8px;margin-top:12px}
.hidden{display:none}
.prog{color:var(--muted);font-size:.85rem;text-align:center;margin-top:10px}
.s{background:var(--card);border:1px solid #2a2e3d;border-radius:10px;padding:12px 14px;margin-bottom:8px;line-height:1.7}
.s .zh{font-size:1.2rem}
.s .py{color:var(--accent);display:block;font-size:.9rem}
.s .tr{color:var(--muted);display:block;font-size:.85rem}
.rule{background:var(--card);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:10px;font-size:.95rem;line-height:1.7}
.rule b{color:var(--accent)}
.qa .a{color:var(--good);display:block;font-size:.9rem;margin-top:4px}
</style>
</head>
<body>
<h1>🎤 口语期中考试 — Sözlü Ara Sınav</h1>
<div class="exam">⏰ <b>9 Kasım 13:30–16:45</b> · 📍 教学楼 <b>314</b> · ⏱ ~7 dk · 📚 <b>1–8. ünite</b><br>Sadece PDF kapsamı — listede gereksiz tek kelime yok.</div>
<div class="sub">Her sekme sınavın bir bölümü. Bildiğin kelimeye dokun → solsun → kart modunda sadece bilmediklerin döner.</div>
<div class="bar">
  <button id="bPin" class="on" onclick="mode('pin')">1️⃣ Pinyin</button>
  <button id="bList" onclick="mode('list')">2️⃣ Kelime</button>
  <button id="bCard" onclick="mode('card')">🃏 Kart</button>
  <button id="bSent" onclick="mode('sent')">3️⃣ Cümle</button>
  <button id="bQa" onclick="mode('qa')">4️⃣ Soru</button>
  <button id="bIntro" onclick="mode('intro')">6️⃣ Tanıtım</button>
</div>
<input id="q" placeholder="ara: hanzi / pinyin / türkçe..." oninput="render()" style="display:none">

<div id="pin"></div>
<div id="list" class="hidden"></div>
<div id="card" class="hidden">
  <div class="card" id="fc" onclick="flip()"></div>
  <div class="row">
    <button onclick="next(false)" style="border-color:var(--bad)">❌ bilemedim</button>
    <button onclick="next(true)" style="border-color:var(--good)">✅ bildim</button>
  </div>
  <div class="prog" id="prog"></div>
</div>
<div id="sent" class="hidden"></div>
<div id="qa" class="hidden"></div>
<div id="intro" class="hidden"></div>

["我是学生。","Wǒ shì xuésheng.","Öğrenciyim."],
["我今年 __ 岁。","Wǒ jīnnián __ suì.","__ yaşındayım."],
["我在华东师范大学学习汉语。","Wǒ zài Huádōng Shīfàn Dàxué xuéxí Hànyǔ.","ECNU'da Çince okuyorum."],
["我的学校在普陀。","Wǒ de xuéxiào zài Pǔtuó.","Okulum Putuo'da."],
["我家有 __ 口人。","Wǒ jiā yǒu __ kǒu rén.","Ailemde __ kişi var."],
["我有一个哥哥。","Wǒ yǒu yí gè gēge.","Bir ağabeyim var. (ailene göre değiştir)"],
["我们班有 __ 个人。","Wǒmen bān yǒu __ gè rén.","Sınıfımızda __ kişi var."],
["我很喜欢汉语。","Wǒ hěn xǐhuan Hànyǔ.","Çinceyi çok severim."],
["谢谢老师！","Xièxie lǎoshī!","Teşekkürler hocam! (kapanış)"]
];
let known=new Set(JSON.parse(localStorage.getItem('hskKnownV2')||'[]'));
function render(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  document.getElementById('list').innerHTML='<div class="grid">'+W.map((w,i)=>{
    if(q&&!(w[0]+w[1]+w[2]).toLowerCase().includes(q))return'';
    return`<div class="w ${known.has(i)?'known':''}" onclick="tog(${i})">
      <div class="h">${w[0]}</div><div class="p">${w[1]}</div><div class="t">${w[2]}</div></div>`;
  }).join('')+'</div>'+
  `<div class="prog">${known.size} / ${W.length} biliniyor — hepsi PDF kapsamı</div>`;
}
function tog(i){known.has(i)?known.delete(i):known.add(i);localStorage.setItem('hskKnownV2',JSON.stringify([...known]));render()}
let deck=[],ci=0,flipped=false;
function startDeck(){deck=W.map((w,i)=>i).filter(i=>!known.has(i));if(!deck.length)deck=W.map((w,i)=>i);
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
  ci=0;flipped=false;draw()}
function draw(){const w=W[deck[ci]];document.getElementById('fc').innerHTML=flipped
  ?`<div class="h">${w[0]}</div><div class="p">${w[1]}</div><div class="t">${w[2]}</div>`
  :`<div class="h">${w[0]}</div><div class="hint">sesli oku, sonra dokun</div>`;
  document.getElementById('prog').textContent=`Kart ${ci+1}/${deck.length} — bilmediklerin önce gelir`}
function flip(){flipped=!flipped;draw()}
function next(ok){if(ok)known.add(deck[ci]);else known.delete(deck[ci]);
  localStorage.setItem('hskKnownV2',JSON.stringify([...known]));
  ci++;if(ci>=deck.length){startDeck()}else{flipped=false;draw()}}
function fillPin(){
  document.getElementById('pin').innerHTML=
  '<div class="sec">Ton kuralları (PDF vurgusu)</div>'+
  RULES.map(r=>`<div class="rule">${r[0]}<br>${r[1]}</div>`).join('')+
  '<div class="sec">PDF örnek pinyinleri — sesli oku</div>'+
  `<div class="s"><span class="zh" style="font-size:1.4rem">${PIN_SAMPLES.join(' · ')}</span></div>`+
  '<div class="sec">Dört ton provası (PDF s.14)</div>'+
  `<div class="s"><span class="zh">ā á ǎ à · ē é ě è · ō ó ǒ ò<br>nī ní nǐ nì · hāo háo hǎo hào<br>zāi zǎi zài · jiān jiǎn jiàn<br>shī shí shǐ shì · shēn shén shěn shèn · lāo láo lǎo lào</span>
  <span class="tr">Her satırı sesli oku, ton geçişlerine dikkat.</span></div>`;
}
function fillSent(){
  document.getElementById('sent').innerHTML='<div class="sec">3. bölüm cümle okuma</div>'+
  S.map(s=>`<div class="s"><span class="zh">${s[0]}</span>${s[1]?`<span class="py">${s[1]}</span>`:''}<span class="tr">${s[2]}</span></div>`).join('')+
  `<div class="rule"><b>5. bölüm (看图说话) kalıbı:</b><br>
  • Yer ise → <b>__ 在 __ 旁边。</b> (hastane/okul/banka/dükkân/gar…)<br>
  • Saat ise → <b>现在 __ 点 __ 分。/ 现在 __ 点半。</b><br>
  • İnsan/nesne ise → <b>这是 __ 。/ 我有 __ 。</b></div>`+
  '<div class="sec">5. bölüm örnek senaryolar</div>'+
  PIC.map(s=>`<div class="s"><span class="tr">🖼 ${s[0]}</span><span class="zh">${s[1]}</span><span class="py">${s[2]}</span><span class="tr">${s[3]}</span></div>`).join('');
}
function fillQa(){
  document.getElementById('qa').innerHTML='<div class="sec">4. bölüm soru-cevap — cevabı sesli söyle</div>'+
  QA.map(s=>`<div class="s qa"><span class="zh">${s[0]}</span><span class="py">${s[1]}</span><span class="tr">${s[2]}</span><span class="a">→ ${s[3]}</span></div>`).join('');
}
function fillIntro(){
  document.getElementById('intro').innerHTML='<div class="sec">6. bölüm 主题介绍 — bu sırayla oku (~30 sn)</div>'+
  INTRO.map((s,i)=>`<div class="s"><span class="zh">${i+1}. ${s[0]}</span><span class="py">${s[1]}</span><span class="tr">${s[2]}</span></div>`).join('')+
  `<div class="rule"><b>Taktik:</b> __ boşluklarını doldur, baştan sona 5 kez sesli prova. Takılırsan durma, sonraki cümleye geç — akıcılık > mükemmellik.</div>`;
}
function mode(m){
  for(const id of['pin','list','card','sent','qa','intro'])document.getElementById(id).classList.add('hidden');
  for(const id of['bPin','bList','bCard','bSent','bQa','bIntro'])document.getElementById(id).classList.remove('on');
  document.getElementById('q').style.display=m==='list'?'block':'none';
  const map={list:'bList',card:'bCard',sent:'bSent',qa:'bQa',intro:'bIntro',pin:'bPin'};
  document.getElementById(m).classList.remove('hidden');
  document.getElementById(map[m]).classList.add('on');
  if(m==='list')render(); if(m==='card')startDeck(); if(m==='pin')fillPin();
  if(m==='sent')fillSent(); if(m==='qa')fillQa(); if(m==='intro')fillIntro();
}
fillPin();
</script>
